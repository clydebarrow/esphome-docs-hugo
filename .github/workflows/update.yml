name: Update Current

on:
  workflow_dispatch:
  schedule:
    - cron: "10 20 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  TZ: "UTC"

permissions:
  contents: write
  pull-requests: write
  deployments: write

jobs:
  update-from-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout up
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: current

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: esphome/esphome-docs
          ref: current
          path: esphome-docs

      - name: Run convert script
        run: |
          python tools/convert_rst_to_md.py esphome-docs .

      - uses: EndBug/add-and-commit@v9
        with:
          add: 'content'

  call-deploy:
    needs: update-from-upstream
    uses: ./.github/workflows/deploy.yml
