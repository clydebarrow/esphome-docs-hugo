{{ define "main" }}
<div class="content-container">
    <div class="sidebar">
        {{ partial "sidebar.html" . }}
    </div>
    <div class="content">
        <h1>{{ .Title }}</h1>
        {{ .Content }}
        
        {{ if .Pages }}
        <div class="section-list">
            {{ range .Pages }}
            <div class="section-item">
                <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
                {{ with .Description }}
                <p>{{ . }}</p>
                {{ end }}
            </div>
            {{ end }}
        </div>
        {{ end }}
    </div>
</div>
{{ end }}
