{{ define "main" }}
<div class="content-container">
    {{ if .Content }}}
    <div class="sidebar">
        {{ partial "sidebar.html" . }}
    </div>
    <div class="content">
        <h1>{{ .Title }}</h1>
        {{ .Content }}
    </div>
    {{ else }}
        <div class="content">
            <h1>{{ .Title }}</h1>
            {{ partial "sidebar.html" . }}
        </div>
    {{ end }}
</div>
{{ end }}
