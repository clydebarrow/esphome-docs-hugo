{{ define "main" }}
<div class="content-container">
    <div class="sidebar {{ if not .Content}}open{{ end }}">
        {{ partial "sidebar.html" . }}
    </div>
    {{ if .Content }}
    <div class="content">
        <h1>{{ .Title }}</h1>
        {{ .Content }}
    </div>
    {{ end }}
</div>
{{ end }}
